apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbit.fullname" . }}-backend
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "orbit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "orbit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: DB_HOST
              {{- if .Values.postgres.deploy }}
              value: {{ include "orbit.fullname" . }}-postgres
              {{- else }}
              value: {{ .Values.postgres.host | quote }}
              {{- end }}
            - name: DB_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-secret" (include "orbit.fullname" .)) }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-secret" (include "orbit.fullname" .)) }}
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              value: {{ .Values.postgres.database | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.postgres.sslmode | quote }}
            - name: DB_TYPE
              value: postgres
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit.fullname" . }}-secret
                  key: jwt-secret
            - name: IPAM_URL
              value: "http://{{ include "orbit.fullname" . }}-ipam:{{ .Values.ipam.service.port }}"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
