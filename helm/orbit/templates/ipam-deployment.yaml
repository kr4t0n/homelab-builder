apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbit.fullname" . }}-ipam
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: ipam
spec:
  replicas: {{ .Values.ipam.replicaCount }}
  selector:
    matchLabels:
      {{- include "orbit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ipam
  template:
    metadata:
      labels:
        {{- include "orbit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ipam
    spec:
      containers:
        - name: ipam
          image: "{{ .Values.ipam.image.repository }}:{{ .Values.ipam.image.tag }}"
          imagePullPolicy: {{ .Values.ipam.image.pullPolicy }}
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.ipam.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
