services:
  postgres:
    image: postgres:17
    container_name: orbit-db
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_password
      POSTGRES_DB: orbit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbit-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      # GIN_MODE: "release"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: orbit
      DB_PASSWORD: orbit_password
      DB_NAME: orbit
      DB_SSLMODE: disable
      DB_TYPE: postgres
      JWT_SECRET: ${JWT_SECRET}
      IPAM_URL: http://ipam:8081
    depends_on:
      postgres:
        condition: service_healthy
      ipam:
        condition: service_started
    restart: unless-stopped

  ipam:
    build:
      context: ./ipam
      dockerfile: Dockerfile
    container_name: orbit-ipam
    environment:
      PORT: "8081"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: orbit-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: