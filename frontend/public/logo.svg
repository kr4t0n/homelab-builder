<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- Orbit Gradients -->
    <linearGradient id="orbit-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="orbit-grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>
    
    <!-- Central Sun Gradient -->
    <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Plate -->
  <rect width="100" height="100" rx="22" fill="#0f172a" />

  <!-- Orbit Rings -->
  <ellipse cx="50" cy="50" rx="35" ry="12" transform="rotate(30 50 50)" fill="none" stroke="url(#orbit-grad1)" stroke-width="1.5" />
  <ellipse cx="50" cy="50" rx="35" ry="12" transform="rotate(150 50 50)" fill="none" stroke="url(#orbit-grad2)" stroke-width="1.5" />

  <!-- Center Star/Nucleus -->
  <circle cx="50" cy="50" r="7" fill="url(#sun-grad)" filter="url(#glow)" />

  <!-- Planet 1 (Cyan) -->
  <circle cx="80.31" cy="67.5" r="2.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Planet 2 (Indigo) -->
  <circle cx="80.31" cy="32.5" r="2" fill="#818cf8" filter="url(#glow)" />
  
  <!-- Tiny Background Moon/Satellite -->
  <circle cx="56" cy="39.61" r="1.5" fill="#cbd5e1" opacity="0.8" />
</svg>

