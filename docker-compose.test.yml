version: '3.8'

# Run with:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
# Exit code 0 = all tests passed

services:
  test-postgres:
    image: postgres:15
    container_name: orbit-test-db
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_password
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # IPAM running instance for backend integration tests
  ipam:
    build:
      context: ./ipam
      dockerfile: Dockerfile
    container_name: orbit-test-ipam
    environment:
      PORT: "8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Backend tests (requires postgres + ipam)
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: orbit-backend-test
    environment:
      DB_TYPE: postgres
      DB_HOST: test-postgres
      DB_PORT: "5432"
      DB_USER: orbit
      DB_PASSWORD: orbit_password
      DB_SSLMODE: disable
      TEST_DB_NAME: orbit_test
      IPAM_URL: http://ipam:8081
    depends_on:
      test-postgres:
        condition: service_healthy
      ipam:
        condition: service_healthy
